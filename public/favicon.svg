<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#grad)"/>
  <!-- Car body -->
  <path d="M4 19h18v5a1 1 0 01-1 1H5a1 1 0 01-1-1v-5z" fill="#fff"/>
  <path d="M6 15l2-4h10l2 4H6z" fill="#fff"/>
  <!-- Windows -->
  <path d="M8 15l1.5-3h7l1.5 3H8z" fill="#1d4ed8" opacity="0.4"/>
  <!-- Wheels -->
  <circle cx="8" cy="23" r="2" fill="#1e3a5f"/>
  <circle cx="18" cy="23" r="2" fill="#1e3a5f"/>
  <!-- Charging plug -->
  <rect x="24" y="12" width="4" height="8" rx="1" fill="#fff"/>
  <rect x="25" y="9" width="2" height="3" fill="#fff"/>
  <!-- Plug prongs -->
  <rect x="25.5" y="6" width="1" height="3" rx="0.5" fill="#fbbf24"/>
  <rect x="27" y="6" width="1" height="3" rx="0.5" fill="#fbbf24"/>
  <!-- Cable -->
  <path d="M22 16c2 0 2 1 2 2" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Electricity spark -->
  <path d="M26 21l1-2h-1l1-2" stroke="#fbbf24" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
